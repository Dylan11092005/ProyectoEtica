<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monumento Arqueológico Nacional El Farallón · Cañas, Guanacaste</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== PALETA BLANCO Y DORADO (MODO OSCURO Y CLARO) ===== */
:root{
  --bg:#141210;--s1:#1c1916;--s2:#231f1b;--s3:#2e2822;
  --tx:#ffffff;--mu:#e0d6c8;--ol:#b0a392;--bd:#423829;
  --pr:#e5b94c;--onpr:#241900;--se:#8fd1a9;--onse:#0b2414;--te:#f3b562;
  --r:14px;color-scheme:dark
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#ffffff;--s1:#faf7f2;--s2:#ffffff;--s3:#f2eadb;
    --tx:#1d1914;--mu:#4e453b;--ol:#756958;--bd:#e2d5bd;
    --pr:#b68616;--onpr:#ffffff;--se:#246848;--onse:#ffffff;--te:#9c6b08;
    color-scheme:light
  }
}
:root[data-theme="light"]{
  --bg:#ffffff;--s1:#faf7f2;--s2:#ffffff;--s3:#f2eadb;
  --tx:#1d1914;--mu:#4e453b;--ol:#756958;--bd:#e2d5bd;
  --pr:#b68616;--onpr:#ffffff;--se:#246848;--onse:#ffffff;--te:#9c6b08;
  color-scheme:light
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{font-family:Newsreader,Georgia,serif;font-weight:500;line-height:1.18;margin:.2em 0}
h1{font-size:clamp(30px,4.5vw,52px)}
h2{font-size:clamp(25px,3.2vw,36px)}
h3{font-size:21px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding-inline:20px}
.lab{font:500 12px "Space Grotesk",sans-serif;letter-spacing:.06em;color:var(--ol)}
.eb{font:700 12px "Space Grotesk",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--pr);margin:0 0 6px}
.pr{color:var(--pr)}.mu{color:var(--mu)}.pl{white-space:pre-line}

/* ===== HEADER & NAVEGACIÓN RESPONSIVA ===== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px;padding:10px 20px;position:relative}
.brand{display:flex;align-items:center;gap:12px;font:600 22px Newsreader,serif;line-height:1.1}
.brand small{display:block;font:600 10px "Space Grotesk";letter-spacing:.12em;color:var(--pr);text-transform:uppercase;margin-top:2px}
.logo-box{width:42px;height:42px;border-radius:10px;border:1px solid var(--pr);background:linear-gradient(135deg,#fff,#f5e3b0);display:grid;place-items:center;overflow:hidden;flex:none;color:#8a6200;font:700 16px Newsreader,serif}
.logo-box img{width:100%;height:100%;object-fit:contain;padding:2px}

nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a{padding:8px 11px;border-radius:8px;font:500 13px "Space Grotesk";color:var(--mu);transition:.2s}
nav a:hover{color:var(--tx);background:var(--s3)}
nav a.on{color:var(--pr);box-shadow:inset 0 -2px var(--pr)}
.h-acts{display:flex;align-items:center;gap:8px}
.mbtn{display:none;background:var(--s3);color:var(--pr);border:1px solid var(--bd);border-radius:8px;width:40px;height:40px;font-size:20px;line-height:1}

@media(max-width:960px){
  .mbtn{display:inline-grid;place-items:center}
  nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--bd);flex-direction:column;align-items:stretch;padding:14px 20px;gap:6px;box-shadow:0 16px 32px #0004}
  nav.open{display:flex}
  nav a{padding:11px 14px;font-size:15px}
  .h-acts .btn{padding:9px 14px;font-size:12px}
}
@media(max-width:480px){
  .brand{font-size:18px}.brand small{font-size:9px}.logo-box{width:36px;height:36px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pr);color:var(--onpr);border:0;border-radius:8px;padding:12px 22px;font:700 13px "Space Grotesk";transition:.2s;text-align:center}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.g{background:var(--s3);color:var(--pr);border:1px solid var(--bd)}
.btn.o{background:transparent;color:#fff;border:1px solid #fffb}
.btn.wa{background:#25d366;color:#0b2414}
.fl{margin:0;cursor:pointer;text-align:center}

/* ===== TICKER ===== */
.ticker{background:var(--pr);color:var(--onpr);font:600 13px "Space Grotesk";padding:8px 0;overflow:hidden;white-space:nowrap}
.ticker div{display:inline-block;padding-left:100%;animation:tk 50s linear infinite}
.ticker:hover div{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.ticker div{animation:none;padding:0}.rv{opacity:1!important;transform:none!important}html{scroll-behavior:auto}}

/* ===== ESPACIADO VERTICAL ENTRE SECCIONES Y BLOQUES ===== */
section{padding-block:54px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.grid{display:grid;gap:28px}
.stack{display:grid;gap:36px}
.stack-sm{display:grid;gap:28px}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

/* ===== HERO & STATS ===== */
.hero{position:relative;min-height:min(80vh,650px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#141210}
.hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#14121066 0,#141210cc 60%,#141210 100%)}
.hc{position:relative;z-index:1;width:100%;padding-top:96px;padding-bottom:96px}
.hc h1{font-size:clamp(32px,5.6vw,62px);max-width:20ch;text-wrap:balance;color:#fff}
.lead{font-size:clamp(16px,2vw,19px);max-width:62ch;color:#f3ede3}
.hc .eb{color:#e5b94c}.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;text-align:center;background:var(--s2);border:1px solid var(--pr);box-shadow:0 20px 50px #0003;border-radius:var(--r);padding:26px 22px;margin-top:-48px;margin-bottom:16px;position:relative;z-index:2}
.stats b{display:block;font:500 clamp(26px,4vw,40px) Newsreader;color:var(--pr)}

/* ===== TARJETAS Y COMPONENTES ===== */
.card{position:relative;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:26px;transition:.25s}
.card.c{cursor:pointer}.card.c:hover{transform:translateY(-4px);box-shadow:0 16px 36px #0003;border-color:var(--pr)}
.ci{margin:-26px -26px 18px;height:195px;overflow:hidden;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(135deg,#332a1d,#1c1916);position:relative}
.ci img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .ci img{transform:scale(1.06)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--s3);font:600 11px "Space Grotesk";color:var(--pr);border:1px solid color-mix(in srgb,var(--pr) 35%,transparent);margin-bottom:8px}
.tag.eco{color:var(--se);border-color:color-mix(in srgb,var(--se) 40%,transparent)}

/* ===== VISOR DE PETROGLIFOS (1 GRANDE + 3 MINIATURAS DE INTRIGA) ===== */
.dec{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.stage{display:grid;grid-template-columns:minmax(280px,1.4fr) 1fr;gap:28px;padding:28px;align-items:center}
.vp{background:#0c0b0a;border-radius:var(--r);height:360px;overflow:hidden;border:1px solid var(--bd)}
.vp img{width:100%;height:100%;object-fit:cover}
.intrigue-box{background:var(--s1);border:1px dashed var(--pr);border-radius:10px;padding:18px;margin-top:20px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 28px 28px;background:var(--s1);border-top:1px solid var(--bd)}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--s2);color:var(--mu);border:1px solid var(--bd);border-radius:10px;padding:12px;transition:.2s;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--pr);color:var(--tx);box-shadow:0 0 0 1px var(--pr)}
.opt-img{width:64px;height:52px;border-radius:8px;overflow:hidden;background:#0c0b0a;flex:none}
.opt-img img{width:100%;height:100%;object-fit:cover}
.opt b{display:block;font:600 16px Newsreader;line-height:1.2}
.opt span{font:500 11px "Space Grotesk";color:var(--ol)}

/* ===== VIDEO, SOSTENIBILIDAD, BITÁCORA Y TARIFAS ===== */
.vg{grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr)}
.video-frame{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:var(--r);background:#0c0b0a;border:1px solid var(--bd);margin:10px 0 12px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;background:var(--s1);padding:14px;border-radius:10px;margin-top:16px}
.meta span{display:block;margin-bottom:2px}

.eco-banner{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--se) 15%,var(--s2)),var(--s2));border:1px solid var(--se);border-radius:var(--r);padding:28px}
.eco-star{width:68px;height:68px;border-radius:50%;background:var(--se);color:#0b2414;display:grid;place-items:center;font:700 24px "Space Grotesk";margin:0 auto}

.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:18px}
.price-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px 14px;text-align:center}
.price-card.hl{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--s1))}
.price-val{display:block;font:600 26px Newsreader;color:var(--pr);margin:6px 0 2px}

.quote-card{background:var(--s2);border:1px solid var(--bd);border-left:3px solid var(--pr);border-radius:var(--r);padding:24px}
.quote-card p{font-style:italic;margin:0 0 12px}

.ph-badge{display:inline-block;font:600 10px "Space Grotesk";text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:4px;background:#e5b94c25;color:var(--pr);border:1px dashed var(--pr);margin-bottom:6px}

.band{background:linear-gradient(125deg,#2d2314,#1a1714);border:1px solid var(--pr);color:#fff;border-radius:var(--r);padding:44px 28px;text-align:center}
.band p{color:#e7e1de;max-width:58ch;margin:10px auto 22px}
.mapa{overflow:hidden;border:1px solid var(--bd);border-radius:var(--r)}
.mapa iframe{display:block;width:100%;height:350px;border:0}

/* ===== AJUSTES RESPONSIVOS MÓVIL / TABLET ===== */
@media(max-width:820px){
  .stage,.vg{grid-template-columns:1fr}
}
@media(max-width:740px){
  section{padding-block:38px}
  .sh{margin-bottom:20px}
  .grid{gap:22px}
  .stack{gap:28px}
  .stack-sm{gap:22px}
  .hero .hc{padding-top:72px;padding-bottom:84px}
  .stats{margin-top:-36px;margin-bottom:12px;padding:20px 16px;gap:14px}
  .card{padding:20px}
  .ci{margin:-20px -20px 16px;height:180px}
  .stage{padding:20px;gap:20px}
  .thumbs{grid-template-columns:1fr;padding:16px 20px 20px;gap:14px}
  .eco-banner{grid-template-columns:1fr;text-align:center;padding:24px 20px;gap:18px}
  .band{padding:34px 20px}
  .quote-card{padding:20px}
}
@media(max-width:560px){
  .vp{height:240px}
}

/* ===== FORMULARIOS Y MODALES ===== */
input,select,textarea{width:100%;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit}
label{display:block;margin:14px 0 5px;font:500 12px "Space Grotesk";color:var(--mu)}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;background:color-mix(in srgb,var(--se) 22%,transparent);color:var(--se)}
.msg.err{background:color-mix(in srgb,#e06c58 22%,transparent);color:#f39282}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 180px}

footer{background:var(--s1);border-top:1px solid var(--bd);padding:44px 0 96px;margin-top:44px;font-size:14px;color:var(--ol)}
.fgrid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
dialog{background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);max-width:680px;width:92%;max-height:90vh;padding:26px;overflow-y:auto}
dialog::backdrop{background:#000a}
.dimg{width:100%;height:220px;object-fit:cover;border-radius:10px;margin-bottom:14px}

/* ===== BOTONES FLOTANTES (TEMA + WHATSAPP) ===== */
.sw{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:50%;width:44px;height:44px;background:var(--s3);color:var(--pr);border:1px solid var(--bd);box-shadow:0 4px 14px #0004}
.wa-float{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:99px;padding:10px 16px;background:#25d366;color:#0b2414;font:700 13px "Space Grotesk";box-shadow:0 6px 20px #0005;display:inline-flex;align-items:center;gap:6px}
.wa-float:hover{filter:brightness(1.06);transform:translateY(-2px)}

.rv{opacity:0;transform:translateY(20px);transition:opacity .65s,transform .65s}.rv.in{opacity:1;transform:none}
.ed{position:absolute;top:10px;right:10px;z-index:3;width:32px;height:32px;border-radius:50%;border:0;background:var(--pr);color:var(--onpr);font-size:15px}
#ab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--pr);color:var(--onpr);border-radius:99px;padding:8px 16px;font:700 12px "Space Grotesk";display:flex;gap:14px}#ab[hidden]{display:none}
.ar{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px;flex-wrap:wrap}.ar b{flex:1 1 200px;font-weight:600}
.th{width:64px;height:48px;border-radius:8px;overflow:hidden;background:var(--s3);flex:none}.th img{width:100%;height:100%;object-fit:cover}
.tb{margin:18px 0}.tb>*{flex:0 0 auto}
#fl{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:60;background:var(--se);color:var(--onse);padding:10px 20px;border-radius:99px;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="top w">
    <a href="#inicio" class="brand">
      <!-- [PLACEHOLDER_LOGO]: Cargar imagen oficial del logo en el panel admin o en cfg.logo -->
      <span class="logo-box" id="lg">EF</span>
      <span><span id="br"></span> <small id="sb"></small></span>
    </a>
    <nav id="nav" aria-label="Principal"></nav>
    <div class="h-acts">
      <a class="btn" href="#visita">Reservar visita</a>
      <button class="mbtn" id="mbtn" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<div class="ticker" aria-label="Noticias y avisos"><div id="tk"></div></div>
<main id="app"></main>

<footer>
  <div class="w fgrid">
    <div>
      <b class="pr" id="fb"></b>
      <p id="ft" style="margin:8px 0"></p>
      <a href="#admin" class="lab">Acceso administrador</a>
    </div>
    <div>
      <p class="eb" style="margin-bottom:6px">Redes y contacto oficial</p>
      <div class="row" style="gap:16px">
        <a id="fig" target="_blank" rel="noopener" class="pr">Instagram @elfarallon_corobici</a>
        <a id="fweb" target="_blank" rel="noopener" class="pr">Farallón Corobicí</a>
      </div>
    </div>
  </div>
</footer>

<div id="ab" hidden><span>Modo administrador</span><a href="#admin">Panel</a><a href="#" id="lo2">Salir</a></div>
<a class="wa-float" id="waf" target="_blank" rel="noopener" aria-label="Consultar por WhatsApp">WhatsApp</a>
<button class="sw" id="theme" aria-label="Cambiar tema claro/oscuro">◐</button>
<dialog id="dlg"><div id="dlgc"></div><p style="margin-top:18px"><button class="btn g" onclick="dlg.close()">Cerrar</button></p></dialog>
<dialog id="edlg"><div id="edc"></div></dialog>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open("farallon_v2",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>{const s=q.result.transaction("k",m==="get"?"readonly":"readwrite").objectStore("k"),x=m==="get"?s.get("db"):s.put(v,"db");x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(e){r()}});

/* ===== CONTENIDO POR DEFECTO (Basado en acuerdos de reunión + placeholders de gira) ===== */
const DEF={
  cfg:{

    ig:"https://www.instagram.com/elfarallon_corobici/",
    fb:"https://www.google.com/search?q=Farallon+Corobici", /* [PLACEHOLDER_FARALLON_COROBICI_URL] */
    pw:hash("farallon2025"),
    ticker:"Monumento Arqueológico Nacional El Farallón · Patrimonio Arquitectónico desde 1998  •  Galardonados con Bandera Azul Ecológica (3 Estrellas)  •  Abierto todos los días de 6:00 a.m. a 5:00 p.m. (último tour recomendado: 3:00 p.m.)  •  Parqueo gratuito",
    hK:"Cañas, Guanacaste · Patrimonio Nacional desde 1998",
    hT:"Monumento Arqueológico Nacional El Farallón",
    hD:"Un santuario único en Centroamérica y el mundo, resguardado por más de 30 años por la misma familia guanacasteca. Venga a recorrer el sendero junto al río y descubra el legado milenario grabado en piedra por los indígenas corobicíes.",
    hI:"img/espiral.jpg", /* [PLACEHOLDER_HERO_IMG]: Actualizar con fotografía panorámica tomada en la gira */
    vid:"Z-oxYI-K8Ys",
    bit:"“El Farallón no solo se observa: se camina bajo la sombra del bosque, se siente junto al río y se escucha en la voz de quienes lo han cuidado toda su vida.”", /* [PLACEHOLDER_EXPERIENCIA_ESTUDIANTES] */
    s1n:"+30",s1l:"Años recibiendo visitantes",
    s2n:"3 ★",s2l:"Bandera Azul Ecológica",
    s3n:"+25",s3l:"Años reciclando",
    s4n:"1998",s4l:"Patrimonio Arquitectónico",
    ecoTitulo:"Galardón Bandera Azul Ecológica · 3 Estrellas",
    ecoTexto:"Comprometidos con la conservación de la cuenca y el turismo sostenible: recientemente obtuvimos 3 estrellas de Bandera Azul Ecológica y sumamos más de 25 años de reciclaje continuo en la finca.",
    footer:"© 2026 Monumento Arqueológico Nacional El Farallón · Cañas, Guanacaste · Ley N° 6703."
  },

function decoder(){
  const items=DB.gl.slice(0,3);
  return `<div class="dec rv">
    <div class="stage">
      <div class="vp" id="gv"></div>
      <div>
        <span class="tag" id="gp"></span>
        <h3 id="gt" class="pr" style="margin-top:6px;font-size:26px"></h3>

        <div class="intrigue-box">
          <b class="pr" style="display:block;font-size:14px">¿Quiere saber qué simbolizan estas figuras?</b>
          <p class="mu" style="font-size:14px;margin:6px 0 14px">Esto es solo un adelanto del gran paredón. Venga al monumento y descubra junto a nuestros guías cada historia grabada en la roca.</p>
          <a class="btn" href="#visita">Ven y conoce · Reservar tour →</a>
        </div>
      </div>

    <div class="thumbs" role="group" aria-label="Seleccionar petroglifo">${items.map(g=>`<div class="opt" role="button" tabindex="0" data-g="${g.id}" onkeydown="if((event.key==='Enter'||event.key===' ')&&!event.target.closest('.ed')){event.preventDefault();showGlyph(${g.id})}">${eb("gl",g.id)}<div class="opt-img">${pic(g.img,g.n)}</div><div><b>${esc(g.n)}</b> <span>${esc(g.cod)}</span></div></div>`).join("")}</div>
  </div>`;
}

function showGlyph(i){
  const g=DB.gl.find(x=>String(x.id)===String(i))||DB.gl[0];
  if(!g||!$("#gv"))return;
  $("#gv").innerHTML=pic(g.img,g.n);
  $("#gt").textContent=g.n;
  $("#gp").textContent=g.per;
  $("#gd").textContent=g.d;
  $$(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g==g.id));
}

function openArt(id){
  const a=DB.arts.find(x=>x.id===id);
  if(!a)return;
  $("#dlgc").innerHTML=`${a.img?`<img class="dimg" src="${esc(a.img)}" alt="">`:""}<span class="tag">${esc(a.cat)}</span><h2>${esc(a.t)}</h2><p class="lab">${esc(a.a)} · ${esc(a.y)}</p><p>${esc(a.x)}</p><p class="mu pl">${a.b?esc(a.b):"Reportaje de archivo sobre El Farallón."}</p>${a.url?`<p><a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Abrir enlace original →</a></p>`:""}`;
  dlg.showModal();
}

      <div class="grid g3">${DB.info.map(textCard("info")).join("")}</div>
      <div class="mapa rv"><iframe title="Mapa de ubicación del Farallón" loading="lazy" src="https://www.openstreetmap.org/export/embed?bbox=-85.09259819984437%2C10.504712410489551%2C-85.08255600929262%2C10.511843465613453&amp;layer=mapnik&amp;marker=10.509934689856358%2C-85.08933913460679"></iframe></div>
      <div class="cta" style="margin-top:0"><a class="btn" href="#visita">Reservar visita ahora</a> <a class="btn g" target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=17/10.509934689856358/-85.08933913460679">Abrir mapa en grande</a></div>
    </div></section>`,

  archivo:()=>`
    <section class="w">${head("Cobertura histórica","Archivo de prensa y videos")}<div class="stack-sm"><div class="row"><input id="q" placeholder="Buscar por medio, tema o título" aria-label="Buscar"><select id="cat" aria-label="Categoría"><option value="">Todas</option>${[...new Set(DB.arts.map(a=>a.cat))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><p class="lab" id="cnt" style="margin:0"></p><div class="grid g3" id="list"></div></div></section>`,

  visita:()=>`
    <section class="w">${head("Reservaciones","Reservar visita guiada por WhatsApp")}
    <div class="stack">
      <div class="grid g2" style="align-items:start">
        <div class="card">
          <p class="mu" style="margin-top:0">Atendemos <b>todos los días de 6:00 a.m. a 5:00 p.m.</b> (último tour recomendado a las 3:00 p.m.). Complete sus datos para enviar su solicitud directo al WhatsApp de nuestra familia:</p>
          <form id="rf" novalidate>
            <label for="rn">Nombre completo</label><input id="rn" placeholder="Ej. Ana María Rojas" required>
            <div class="row">
              <div><label for="rd">Fecha deseada</label><input id="rd" type="date" required></div>
              <div><label for="rh">Horario preferido</label><select id="rh"><option>Mañana (6:00 a.m. - 11:30 a.m.)</option><option>Tarde (12:00 m.d. - 3:00 p.m. máx.)</option></select></div>
            </div>
            <div class="row">
              <div><label for="rt">Tipo de tarifa</label><select id="rt"><option>Nacional (₡6.000 p/p)</option><option>Extranjero (₡10.000 p/p)</option><option>Estudiante colegio (₡3.000 p/p)</option><option>Universitario (₡4.500 negociable)</option><option>Grupo mixto / con niños (&lt;12 gratis)</option></select></div>
              <div><label for="rp">Cantidad de personas</label><input id="rp" type="number" min="1" max="200" value="2" required></div>
            </div>
            <label for="rmot">Consultas adicionales (opcional)</label><textarea id="rmot" rows="2" placeholder="Ej. Interés en paseo a caballo, miel de abeja de temporada o grupo estudiantil"></textarea>
            <p style="margin-top:18px;margin-bottom:0"><button class="btn wa" style="width:100%">Enviar reserva por WhatsApp →</button></p>
          </form>
          <div id="rm" role="status"></div>
        </div>
        <div class="stack-sm">
          ${pricingSection()}
          <div class="card">
            <h3>Recuerde antes de viajar</h3>
            <p class="mu" style="margin-bottom:0">• Grupos en el sitio: máximo 12 personas por recorrido (grupos grandes se dividen por turnos).<br>• Parqueo gratis y permiso para llevar alimentos (recoger su basura).<br>• Llevar tenis, agua, repelente, gorra, bloqueador solar y pantaloneta si desea bañarse en el río.</p>
          </div>
        </div>
      </div>
      <div id="rl"></div>
    </div></section>`,

  admin:()=>{
    if(!ADM)return `<section class="w"><h1>Acceso administrador</h1><div class="card" style="max-width:420px;margin-top:20px"><form id="lf"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required><p style="margin-top:16px;margin-bottom:0"><button class="btn">Entrar</button></p></form><div id="lm" role="status"></div></div></section>`;
    const tabs=[["cfg","Ajustes generales"],...Object.entries(SC).map(([k,v])=>[k,v.n])];let body;
    if(TAB==="cfg")body=`<form id="cf">${CFG.map(f=>field(f,f[0]==="pw"?"":DB.cfg[f[0]])).join("")}<p style="margin-top:18px"><button class="btn">Guardar cambios</button></p></form>`;
    else{const s=SC[TAB];body=`<p><button class="btn" data-add="${TAB}">+ Agregar</button></p>`+(DB[TAB].map(it=>`<div class="card ar"><div class="th">${pic(it.img)}</div><b>${esc(s.lab(it))}</b><span><button class="btn g" data-ed="${TAB}:${it.id}">Editar</button> <button class="btn g" data-rm="${TAB}:${it.id}">Eliminar</button></span></div>`).join("")||`<p class="mu">No hay elementos todavía.</p>`)}
    return `<section class="w">${head("Modo administrador","Panel de administración")}<div class="row tb">${tabs.map(([k,n])=>`<button class="btn${k===TAB?"":" g"}" data-tab="${k}">${n}</button>`).join("")}</div>${body}<hr style="border:0;border-top:1px solid var(--bd);margin:32px 0"><div class="row tb"><button class="btn g" id="ex">Exportar contenido</button><label class="btn g fl">Importar<input type="file" id="im" accept="application/json" hidden></label><button class="btn g" id="rs">Restablecer valores originales</button><button class="btn g" id="lo">Cerrar sesión</button></div></section>`;
  }
};

/* ===== LÓGICA ===== */
function renderList(){
  const q=$("#q").value.toLowerCase(),c=$("#cat").value;
  const r=DB.arts.filter(a=>(!c||a.cat===c)&&[a.t,a.a,a.x,a.cat].join(" ").toLowerCase().includes(q));
  $("#list").innerHTML=r.map(artCard).join("")||'<p class="mu">Sin resultados. Pruebe otro término o elija “Todas”.</p>';
  $("#cnt").textContent=r.length+" registros";reveal();
}
function tick(){const c=$("#clk");if(c)c.textContent=new Date().toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"})}
function listRes(){
  const r=store.get("res",[]),el=$("#rl");
  if(el)el.innerHTML=r.length?`<h3>Solicitudes recientes enviadas</h3><div class="stack-sm" style="gap:12px;margin-top:12px">`+r.map((x,i)=>`<div class="card" style="padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><span>${[esc(x.n),esc(x.d),x.h&&esc(x.h),(x.p||1)+" pers."+(x.t?` (${esc(x.t)})`:"")].filter(Boolean).join(" · ")}</span><button class="btn g" data-del="${i}">Borrar</button></div>`).join("")+`</div>`:"";
}
const io=window.IntersectionObserver&&new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
function reveal(){$$(".rv:not(.in)").forEach(e=>io?io.observe(e):e.classList.add("in"))}
function chrome(){
  const c=DB.cfg;
  $("#br").textContent=c.brand;$("#sb").textContent=c.sub;$("#tk").textContent=c.ticker;
  $("#fb").textContent=c.brand;$("#ft").textContent=c.footer;$("#ab").hidden=!ADM;
  $("#lg").innerHTML=c.logo?`<img src="${esc(c.logo)}" alt="Logo El Farallón">`:`<span>EF</span>`;
  $("#waf").href=waLink("Hola, tengo una consulta sobre el Monumento Arqueológico Nacional El Farallón.");
  $("#fig").href=c.ig||"#";$("#fweb").href=c.fb||"#";
}
function closeMenu(){$("#nav").classList.remove("open");$("#mbtn").setAttribute("aria-expanded","false")}
function route(keep){
  const k=location.hash.slice(1)||"inicio",key=VIEWS[k]?k:"inicio";
  $("#app").innerHTML=VIEWS[key]();document.title=PAGES[key]+" · "+DB.cfg.brand;chrome();
  $("#nav").innerHTML=NAVKEYS.map(p=>`<a href="#${p}" class="${p===key?"on":""}" ${p===key?'aria-current="page"':""}>${PAGES[p]}</a>`).join("");
  closeMenu();
  if($(".dec"))showGlyph(DB.gl[0]?.id);
  if($("#list")){renderList();$("#q").oninput=renderList;$("#cat").onchange=renderList}
  if(key==="visita"){$("#rd").min=new Date().toISOString().slice(0,10);listRes()}
  tick();reveal();if(!keep)scrollTo(0,0);
}
const flash=t=>{const d=document.createElement("div");d.id="fl";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)};
async function save(msg="Cambios guardados"){await idb("put",DB);route(1);flash(msg)}
function editItem(c,id){
  const s=SC[c],it=id?DB[c].find(x=>String(x.id)===String(id)):{};
  if(!it)return;
  $("#edc").innerHTML=`<h2>${id?"Editar":"Agregar"} · ${s.n}</h2><form id="ef" data-c="${c}" data-id="${id||""}">${s.f.map(f=>field(f,it[f[0]]??"")).join("")}<p class="row" style="margin-top:18px"><button class="btn">Guardar</button><button type="button" class="btn g" onclick="edlg.close()">Cancelar</button></p></form>`;
  edlg.showModal();
}

$("#mbtn").onclick=()=>{const n=$("#nav"),o=n.classList.toggle("open");$("#mbtn").setAttribute("aria-expanded",o)};
addEventListener("hashchange",()=>route());setInterval(tick,30000);

document.addEventListener("click",async e=>{
  const t=e.target,q=s=>t.closest(s);
  if(!q("header"))$("#nav").classList.contains("open")&&closeMenu();
  const g=q(".opt");if(g&&!q(".ed"))showGlyph(g.dataset.g);
  const d=q("[data-del]");if(d){const r=store.get("res",[]);r.splice(+d.dataset.del,1);store.set("res",r);listRes()}
  const ed=q("[data-ed]");if(ed&&ADM){e.preventDefault();const[c,id]=ed.dataset.ed.split(":");editItem(c,id)}
  const ad=q("[data-add]");if(ad)editItem(ad.dataset.add);
  const tb=q("[data-tab]");if(tb){TAB=tb.dataset.tab;route(1)}
  const rm=q("[data-rm]");if(rm&&confirm("¿Eliminar este elemento?")){const[c,id]=rm.dataset.rm.split(":");DB[c]=DB[c].filter(x=>String(x.id)!==id);save("Elemento eliminado")}
  if(q("#ex")){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download="contenido.json";a.click()}
  if(q("#rs")&&confirm("Se restaurará todo el contenido original. ¿Continuar?")){DB=clone(DEF);save("Contenido restablecido")}
  if(q("#lo")||q("#lo2")){e.preventDefault();ADM=false;sessionStorage.removeItem("adm");location.hash="#inicio";route()}
});

document.addEventListener("change",e=>{
  const t=e.target,u=t.dataset&&t.dataset.up;
  if(u&&t.files[0]){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);$("#"+u).value=c.toDataURL("image/jpeg",.82);flash("Imagen cargada")};i.src=r.result};r.readAsDataURL(t.files[0])}
  if(t.id==="im"&&t.files[0]){t.files[0].text().then(x=>{try{merge(JSON.parse(x));save("Contenido importado")}catch(err){alert("El archivo no es un JSON válido.")}})}
});

document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="rf"){
    const m=$("#rm"),n=$("#rn").value.trim(),d=$("#rd").value,h=$("#rh").value,tt=$("#rt").value,p=+$("#rp").value,mot=$("#rmot").value.trim();
    if(!n||!d||p<1||p>200){m.className="msg err";m.textContent="Complete su nombre, fecha deseada y cantidad válida de personas (1 a 200).";return}
    const r=store.get("res",[]);r.push({n,d,h,t:tt,p});store.set("res",r);listRes();
    const txt=`Hola, me gustaría reservar una visita al Monumento Arqueológico Nacional El Farallón:\n• Nombre: ${n}\n• Fecha: ${d}\n• Horario: ${h}\n• Personas: ${p}\n• Tarifa: ${tt}${mot?"\n• Consulta adicional: "+mot:""}`;
    const url=waLink(txt);
    m.className="msg";
    m.innerHTML=`¡Solicitud lista! Si WhatsApp no se abrió automáticamente, haga clic aquí: <a class="pr" style="text-decoration:underline" href="${url}" target="_blank" rel="noopener"><b>Abrir WhatsApp</b></a>`;
    window.open(url,"_blank","noopener");
  }
  if(f.id==="lf"){if(hash($("#lp").value)===DB.cfg.pw){ADM=true;sessionStorage.setItem("adm","1");route();flash("Bienvenido, administrador")}else{const m=$("#lm");m.className="msg err";m.textContent="Contraseña incorrecta."}}
  if(f.id==="cf"){CFG.forEach(([k])=>{const v=$("#f_"+k).value;if(k==="pw"){if(v.trim())DB.cfg.pw=hash(v.trim())}else DB.cfg[k]=v});save()}
  if(f.id==="ef"){const c=f.dataset.c,id=f.dataset.id,o={};SC[c].f.forEach(([k,,t])=>{const v=$("#f_"+k).value.trim();o[k]=t==="number"?+v||0:v});if(id)Object.assign(DB[c].find(x=>String(x.id)===id),o);else DB[c].push({id:Date.now(),...o});edlg.close();save()}
});

$("#theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=getComputedStyle(h).colorScheme==="dark"?"light":"dark"};

(async()=>{
  try{const r=await fetch("data/contenido.json",{cache:"no-cache"});if(r.ok)merge(await r.json())}catch(e){}
  const l=await idb("get");if(l)merge(l);
  route();
})();
</script>
</body>
</html>
