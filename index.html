const textCard=c=>d=>`<div class="card rv">${eb(c,d.id)}<h3>${esc(d.t)}</h3><p class="mu pl">${esc(d.x)}</p></div>`;
const head=(e,t,more)=>`<div class="sh"><div><p class="eb">${e}</p><h2>${t}</h2></div>${more||""}</div>`;
const news=()=>`<section class="w"><div class="band rv"><p class="eb" style="color:#f2be71">Boletín mensual</p><h2>Reciba “El Eco de la Piedra”</h2><p>Transcripciones fotogramétricas y alertas de preservación en su correo.</p><form id="nf" class="row" novalidate style="max-width:520px;margin:auto"><input id="ne" type="email" placeholder="investigador@universidad.edu" aria-label="Correo" required><button class="btn">Unirse a la red</button></form><div id="nm" role="status"></div></div></section>`;
function decoder(){return `<div class="dec rv"><div class="opts" role="group" aria-label="Glifos">${DB.gl.map(g=>`<button class="opt" data-g="${g.id}">${eb("gl",g.id)}<b>${esc(g.n)}</b><span>${esc(g.cod)}</span></button>`).join("")}</div><div class="stage"><div class="vp" id="gv"></div><h3 id="gt" class="pr" style="margin-top:16px"></h3><span class="tag" id="gp"></span><p class="mu" id="gd"></p><div class="meta" id="gm"></div></div></div>`}
function showGlyph(i){const g=DB.gl.find(x=>String(x.id)===String(i))||DB.gl[0];if(!g||!$("#gv"))return;$("#gv").innerHTML=pic(g.img,g.n);$("#gt").textContent=g.n;$("#gp").textContent=g.per;$("#gd").textContent=g.d;
 const L=["Profundidad","Azimut","Asociación","Frecuencia"];$("#gm").innerHTML=[g.m0,g.m1,g.m2,g.m3].map((v,k)=>`<div><span>${L[k]}</span><b>${esc(v)}</b></div>`).join("");
 $$(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g==g.id))}
function openArt(id){const a=DB.arts.find(x=>x.id===id);if(!a)return;$("#dlgc").innerHTML=`${a.img?`<img class="dimg" src="${esc(a.img)}" alt="">`:""}<span class="tag">${esc(a.cat)}</span><h2>${esc(a.t)}</h2><p class="lab">${esc(a.a)} · ${a.min} min · ${esc(a.y)}</p><p>${esc(a.x)}</p><p class="mu pl">${a.b?esc(a.b):"Texto completo disponible en la edición impresa del boletín."}</p>`;dlg.showModal()}

/* ===== VISTAS ===== */
const PAGES={inicio:"Inicio",actualidad:"Actualidad arqueológica",petroglifos:"Petroglifos y simbología",historia:"Historia Corobicí",expediciones:"Expediciones y rutas",archivo:"Archivo histórico",visita:"Visita",admin:"Administración"};
const NAVKEYS=["inicio","actualidad","petroglifos","historia","expediciones","archivo"];
const W=h=>`<div class="w">${h}</div>`;
const VIEWS={
inicio:()=>{const c=DB.cfg;return `<div class="hero"><img class="hbg" src="${esc(c.hI)}" alt=""><div class="hc w"><p class="eb">${esc(c.hK)}</p><h1>${esc(c.hT)}</h1><p class="lead">${esc(c.hD)}</p><div class="cta"><a class="btn" href="#archivo">Leer investigaciones</a><a class="btn o" href="#visita">Reservar visita</a></div></div></div>
${W(`<div class="stats rv">${[1,2,3].map(i=>`<div><b>${esc(c["s"+i+"n"])}</b><span class="lab">${esc(c["s"+i+"l"])}</span></div>`).join("")}</div>`)}
<section class="w">${head("Publicaciones","Investigaciones y ensayos",`<a class="pr" href="#archivo">Ver todas →</a>`)}<div class="grid g3">${DB.arts.slice(0,3).map(artCard).join("")}</div></section>
<section class="w">${head("Epigrafía","Decodificador de glifos")}<p class="mu">Elija un motivo grabado sobre la ignimbrita y explore su significado.</p>${decoder()}</section>
<section class="w"><div class="grid vg"><div class="rv"><p class="eb">Explora El Farallón</p><h2>El monumento en imágenes</h2><div class="video-frame"><iframe src="https://www.youtube.com/embed/${esc(c.vid)}" title="Video sobre el monumento El Farallón" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="mu">¿No carga el reproductor? <a class="pr" href="https://www.youtube.com/watch?v=${esc(c.vid)}" target="_blank" rel="noopener noreferrer">Ver en YouTube</a>.</p></div>
<aside class="card rv" style="align-self:center"><div class="lab pr">Bitácora de campo</div><h3>${esc(c.bit)}</h3><div class="meta"><div><span>Incidencia solar hoy</span><b class="pr" id="sun">—</b></div><div><span>Hora local</span><b id="clk">—</b></div></div></aside></div></section>
${news()}`},
actualidad:()=>`<section class="w">${head("Novedades","Actualidad arqueológica")}<div class="grid g3">${DB.arts.filter(a=>+a.y>=2023).map(artCard).join("")}</div></section>${news()}`,
petroglifos:()=>`<section class="w">${head("Epigrafía","Petroglifos y simbología")}${decoder()}</section>`,
historia:()=>`<section class="w">${head("Memoria","Historia Corobicí")}<div class="grid g2">${DB.hist.map(textCard("hist")).join("")}</div></section><section class="w">${head("Lecturas","Para profundizar")}<div class="grid g3">${DB.arts.filter(a=>["Etnohistoria","Epigrafía"].includes(a.cat)).map(artCard).join("")}</div></section>`,
expediciones:()=>`<section class="w">${head("Explore","Expediciones y rutas")}<p class="mu">Elija cómo explorar los paisajes y el patrimonio de El Farallón.</p><div class="grid g3" style="margin-top:20px">${DB.tours.map(t=>`<article class="card rv">${eb("tours",t.id)}<div class="ci">${pic(t.img,t.t)}</div><span class="tag">${esc(t.tag)}</span><h3>${esc(t.t)}</h3><p class="mu">${esc(t.x)}</p></article>`).join("")}</div><div class="grid g3" style="margin-top:24px">${DB.info.map(textCard("info")).join("")}</div><div class="mapa rv"><iframe title="Mapa de ubicación del Farallón" loading="lazy" src="https://www.openstreetmap.org/export/embed?bbox=-85.09259819984437%2C10.504712410489551%2C-85.08255600929262%2C10.511843465613453&amp;layer=mapnik&amp;marker=10.509934689856358%2C-85.08933913460679"></iframe></div><p style="margin-top:14px"><a class="btn" href="#visita">Reservar visita guiada</a> <a class="btn g" target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=17/10.509934689856358/-85.08933913460679">Ver el mapa más grande</a></p></section>`,
archivo:()=>`<section class="w">${head("Biblioteca","Archivo histórico")}<div class="row"><input id="q" placeholder="Buscar por título, autor o tema" aria-label="Buscar"><select id="cat" aria-label="Categoría"><option value="">Todas</option>${[...new Set(DB.arts.map(a=>a.cat))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><p class="lab" id="cnt"></p><div class="grid g3" id="list"></div></section>`,
visita:()=>`<section class="w">${head("Reservaciones","Reservar visita guiada")}<div class="card" style="max-width:560px"><form id="rf" novalidate><label for="rn">Nombre</label><input id="rn" required><label for="re">Correo</label><input id="re" type="email" required><div class="row"><div><label for="rd">Fecha</label><input id="rd" type="date" required></div><div><label for="rp">Personas</label><input id="rp" type="number" min="1" max="15" value="2" required></div></div><p style="margin-top:16px"><button class="btn">Confirmar reserva</button></p></form><div id="rm" role="status"></div></div><div id="rl"></div></section>`,
admin:()=>{
 if(!ADM)return `<section class="w"><h1>Acceso administrador</h1><div class="card" style="max-width:420px"><form id="lf"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required><p><button class="btn">Entrar</button></p></form><div id="lm" role="status"></div></div></section>`;
 const tabs=[["cfg","Ajustes generales"],...Object.entries(SC).map(([k,v])=>[k,v.n])];let body;
 if(TAB==="cfg")body=`<form id="cf">${CFG.map(f=>field(f,f[0]==="pw"?"":DB.cfg[f[0]])).join("")}<p><button class="btn">Guardar cambios</button></p></form>`;
 else{const s=SC[TAB];body=`<p><button class="btn" data-add="${TAB}">+ Agregar</button></p>`+(DB[TAB].map(it=>`<div class="card ar"><div class="th">${pic(it.img)}</div><b>${esc(s.lab(it))}</b><span><button class="btn g" data-ed="${TAB}:${it.id}">Editar</button> <button class="btn g" data-rm="${TAB}:${it.id}">Eliminar</button></span></div>`).join("")||`<p class="mu">No hay elementos todavía.</p>`)}
 return `<section class="w">${head("Modo administrador","Panel de administración")}<div class="row tb">${tabs.map(([k,n])=>`<button class="btn${k===TAB?"":" g"}" data-tab="${k}">${n}</button>`).join("")}</div>${body}<hr style="border:0;border-top:1px solid var(--bd);margin:32px 0"><div class="row tb"><button class="btn g" id="ex">Exportar contenido</button><label class="btn g fl">Importar<input type="file" id="im" accept="application/json" hidden></label><button class="btn g" id="rs">Restablecer valores originales</button><button class="btn g" id="lo">Cerrar sesión</button></div></section>`}
};

/* ===== LÓGICA ===== */
function renderList(){const q=$("#q").value.toLowerCase(),c=$("#cat").value,r=DB.arts.filter(a=>(!c||a.cat===c)&&(a.t+a.a+a.x+a.cat).toLowerCase().includes(q));
 $("#list").innerHTML=r.map(artCard).join("")||'<p class="mu">Sin resultados. Pruebe otro término o elija “Todas”.</p>';$("#cnt").textContent=r.length+" documentos";reveal()}
function tick(){const d=new Date(),c=$("#clk");if(c)c.textContent=d.toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"});
 const s=$("#sun");if(s){const h=d.getHours()+d.getMinutes()/60;s.textContent=(h<6||h>18)?"Bajo horizonte":Math.round(90+(h-6)/12*180)+"° "+(h<12?"ESE":h<15?"S":"OSO")}}
function listRes(){const r=store.get("res",[]),el=$("#rl");if(el)el.innerHTML=r.length?`<h3>Sus reservas</h3>`+r.map((x,i)=>`<div class="card" style="margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center"><span>${esc(x.n)} · ${esc(x.d)} · ${x.p} pers.</span><button class="btn g" data-del="${i}">Cancelar</button></div>`).join(""):""}
const io=window.IntersectionObserver&&new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
function reveal(){$$(".rv:not(.in)").forEach(e=>io?io.observe(e):e.classList.add("in"))}
function chrome(){const c=DB.cfg;$("#br").textContent=c.brand;$("#sb").textContent=c.sub;$("#tk").textContent=c.ticker;$("#fb").textContent=c.brand;$("#ft").textContent=c.footer;$("#ab").hidden=!ADM}
function route(keep){const k=location.hash.slice(1)||"inicio",key=VIEWS[k]?k:"inicio";
 $("#app").innerHTML=VIEWS[key]();document.title=PAGES[key]+" · "+DB.cfg.brand;chrome();
 $("#nav").innerHTML=NAVKEYS.map(p=>`<a href="#${p}" class="${p===key?"on":""}" ${p===key?'aria-current="page"':""}>${PAGES[p]}</a>`).join("");
 if($(".dec"))showGlyph(DB.gl[0]?.id);if($("#list")){renderList();$("#q").oninput=renderList;$("#cat").onchange=renderList}
 if(key==="visita"){$("#rd").min=new Date().toISOString().slice(0,10);listRes()}
 tick();reveal();if(!keep)scrollTo(0,0)}
const flash=t=>{const d=document.createElement("div");d.id="fl";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)};
async function save(msg="Cambios guardados"){await idb("put",DB);route(1);flash(msg)}
function editItem(c,id){const s=SC[c],it=id?DB[c].find(x=>String(x.id)===String(id)):{};if(!it)return;
 $("#edc").innerHTML=`<h2>${id?"Editar":"Agregar"} · ${s.n}</h2><form id="ef" data-c="${c}" data-id="${id||""}">${s.f.map(f=>field(f,it[f[0]]??"")).join("")}<p class="row"><button class="btn">Guardar</button><button type="button" class="btn g" onclick="edlg.close()">Cancelar</button></p></form>`;edlg.showModal()}

addEventListener("hashchange",()=>route());setInterval(tick,30000);
document.addEventListener("click",async e=>{const t=e.target,q=s=>t.closest(s);
 const g=q(".opt");if(g&&!q(".ed"))showGlyph(g.dataset.g);
 const d=q("[data-del]");if(d){const r=store.get("res",[]);r.splice(+d.dataset.del,1);store.set("res",r);listRes()}
 const ed=q("[data-ed]");if(ed&&ADM){e.preventDefault();const[c,id]=ed.dataset.ed.split(":");editItem(c,id)}
 const ad=q("[data-add]");if(ad)editItem(ad.dataset.add);
 const tb=q("[data-tab]");if(tb){TAB=tb.dataset.tab;route(1)}
 const rm=q("[data-rm]");if(rm&&confirm("¿Eliminar este elemento? Esta acción no se puede deshacer.")){const[c,id]=rm.dataset.rm.split(":");DB[c]=DB[c].filter(x=>String(x.id)!==id);save("Elemento eliminado")}
 if(q("#ex")){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download="contenido.json";a.click()}
 if(q("#rs")&&confirm("Se restaurará todo el contenido original. ¿Continuar?")){DB=clone(DEF);save("Contenido restablecido")}
 if(q("#lo")||q("#lo2")){e.preventDefault();ADM=false;sessionStorage.removeItem("adm");location.hash="#inicio";route()}});
document.addEventListener("change",e=>{const t=e.target,u=t.dataset&&t.dataset.up;
 if(u&&t.files[0]){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);$("#"+u).value=c.toDataURL("image/jpeg",.82);flash("Imagen cargada")};i.src=r.result};r.readAsDataURL(t.files[0])}
 if(t.id==="im"&&t.files[0]){t.files[0].text().then(x=>{try{merge(JSON.parse(x));save("Contenido importado")}catch(err){alert("El archivo no es un JSON válido.")}})}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
 if(f.id==="nf"){const m=$("#nm"),v=$("#ne").value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){m.className="msg err";m.textContent="Escriba un correo válido, por ejemplo nombre@universidad.edu.";return}
  const s=store.get("subs",[]);if(!s.includes(v)){s.push(v);store.set("subs",s)}m.className="msg";m.textContent="Suscrito. Recibirá el compendio del mes en "+v+".";$("#ne").value=""}
 if(f.id==="rf"){const m=$("#rm"),n=$("#rn").value.trim(),em=$("#re").value.trim(),d=$("#rd").value,p=+$("#rp").value;
  if(!n||!/^\S+@\S+\.\S+$/.test(em)||!d||p<1||p>15){m.className="msg err";m.textContent="Complete nombre, un correo válido, una fecha y de 1 a 15 personas.";return}
  const r=store.get("res",[]);r.push({n,d,p});store.set("res",r);m.className="msg";m.textContent="Reserva confirmada para el "+d+". Llegue 15 minutos antes.";f.reset();$("#rp").value=2;listRes()}
 if(f.id==="lf"){if(hash($("#lp").value)===DB.cfg.pw){ADM=true;sessionStorage.setItem("adm","1");route();flash("Bienvenido, administrador")}else{const m=$("#lm");m.className="msg err";m.textContent="Contraseña incorrecta."}}
 if(f.id==="cf"){CFG.forEach(([k])=>{const v=$("#f_"+k).value;if(k==="pw"){if(v.trim())DB.cfg.pw=hash(v.trim())}else DB.cfg[k]=v});save()}
 if(f.id==="ef"){const c=f.dataset.c,id=f.dataset.id,o={};SC[c].f.forEach(([k,,t])=>{const v=$("#f_"+k).value.trim();o[k]=t==="number"?+v||0:v});
  if(id)Object.assign(DB[c].find(x=>String(x.id)===id),o);else DB[c].push({id:Date.now(),...o});edlg.close();save()}});
$("#theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=getComputedStyle(h).colorScheme==="dark"?"light":"dark"};

(async()=>{try{const r=await fetch("data/contenido.json",{cache:"no-cache"});if(r.ok)merge(await r.json())}catch(e){}
 const l=await idb("get");if(l)merge(l);route()})();
</script>
</body>
</html>
